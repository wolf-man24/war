
name: Auto Check JavaScript

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check updated JavaScript files
        run: |
          count=0
          for file in *.js; do
            [ -f "$file" ] || continue
            count=$((count + 1))
            echo "Checking $file"
            node --check "$file"
          done
          echo "Checked $count JavaScript files."
